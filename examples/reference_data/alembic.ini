# Minimal Alembic config for the worked example. The database URL is overridden by the test that runs this
# project, and by the -x url=... argument documented in README.md.
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///example.db
# No prepend_sys_path here: the revisions resolve their CSVs from __file__, so nothing needs importing from
# the project root. A project that does import its own models should set both prepend_sys_path and, on
# Alembic 1.20+, path_separator = os - without the latter, 1.20 warns that it is falling back to splitting
# the value on spaces, commas and colons.

[loggers]
keys = root,sqlalchemy,alembic,alembic_static_data

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# The operation logs its UpsertResult at INFO, which is the point of the example.
[logger_alembic_static_data]
level = INFO
handlers =
qualname = alembic_static_data

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
