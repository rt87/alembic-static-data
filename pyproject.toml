[project]
name = "alembic-static-data"
version = "0.1.0"
description = "Alembic plugin: idempotent loading of static reference data from CSV files, keyed on natural keys"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "sqlalchemy>=2.0",
]

[project.entry-points."alembic.plugins"]
# Target is a single module exposing `setup(plugin)`. Needs alembic>=1.20.1: 1.20.0 wrongly iterated the loaded
# object (`for mod in entrypoint.load()`), fixed in 1.20.1 (alembic #1873). See alembic/runtime/plugins.py::_setup.
alembic_static_data = "alembic_static_data.plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alembic_static_data"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["alembic_static_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=alembic_static_data --cov-report=term-missing"
