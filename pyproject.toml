[project]
name = "alembic-static-data"
version = "0.1.0"
description = "Alembic plugin: idempotent loading of static reference data from CSV files, keyed on natural keys"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "sqlalchemy>=2.0",
]

[project.entry-points."alembic.plugins"]
# Alembic does `for mod in entrypoint.load()`, so the target must be an iterable of plugin modules,
# each exposing `setup(plugin)`. See alembic/runtime/plugins.py::_setup.
alembic_static_data = "alembic_static_data:PLUGIN_MODULES"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alembic_static_data"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["alembic_static_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=alembic_static_data --cov-report=term-missing"
