name: CI

# Runs on every push to main and on every pull request against it. Public repositories get Actions minutes
# for free, which is what unblocked this - the workflow was dispatch-only while the account's minutes were
# exhausted. workflow_dispatch stays, for re-running the matrix by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      # Fails if anything in the code needs a newer Python than requires-python promises.
      - run: uv run vermin -t=3.11- --violations --no-tips src tests

  test:
    name: py${{ matrix.python-version }} / alembic ${{ matrix.alembic }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Supported interpreters against whatever Alembic resolves to now.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        alembic: ["resolved"]
        include:
          # One job per Alembic plugin-loading regime; see "Alembic compatibility" in the README.
          # 1.17.x has no plugin system, 1.18.0-1.20.0 iterate the entry point, 1.20.1+ take a module.
          - python-version: "3.14"
            alembic: "1.17.0"
          - python-version: "3.14"
            alembic: "1.18.0"
          - python-version: "3.14"
            alembic: "1.19.2"
          - python-version: "3.14"
            alembic: "1.20.0"
          # Oldest supported combination of both.
          - python-version: "3.11"
            alembic: "1.17.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Test (resolved Alembic)
        if: matrix.alembic == 'resolved'
        # The coverage gate lives here rather than in pyproject's addopts, so a local partial run
        # (pytest -k ...) does not fail on coverage while CI still holds the line the badge claims. It runs
        # on every supported Python, so a regression cannot hide behind one interpreter.
        run: uv run --frozen pytest -q -W error::DeprecationWarning --cov-fail-under=100

      - name: Test (Alembic ${{ matrix.alembic }})
        if: matrix.alembic != 'resolved'
        # No coverage gate here on purpose: below Alembic 1.18 two plugin-system tests skip themselves, so
        # the measured percentage is not comparable. The gate lives on the jobs that run the whole suite.
        run: uv run --frozen --with "alembic==${{ matrix.alembic }}" pytest -q --no-cov -W error::DeprecationWarning
